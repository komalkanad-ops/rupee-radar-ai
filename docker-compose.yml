version: "3.9"
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: changeme-root
      MYSQL_USER: rupeeradar
      MYSQL_PASSWORD: changeme
      MYSQL_DATABASE: rupeeradarai
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mysql
    ports:
      - "127.0.0.1:4000:4000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../admin-console/dist:/usr/share/nginx/html/admin:ro
      - ../web/dist:/usr/share/nginx/html/web:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  mysqldata:
