name: Weekly security scan

# Runs every Wednesday (and on demand). Dependency CVEs, leaked secrets, Node/Express SAST across
# backend + web + admin-console + android, plus the production probe — see scripts/ci/security-scan.sh.
# Any finding opens (and re-comments on) one deduped `security-scan` issue; a clean run closes it.
# Read-only: no secrets, no writes to prod, never runs on PRs.
on:
  schedule:
    - cron: "0 4 * * 3" # Wednesday 04:00 UTC ≈ 09:30 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scanners
        run: bash scripts/ci/security-scan.sh

      - name: Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "🔒 Weekly security scan — findings";
            const label = "security-scan";
            const dir = "findings";
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => f.endsWith(".md")) : [];
            const parts = files
              .map((f) => fs.readFileSync(`${dir}/${f}`, "utf8").trim())
              .filter((s) => s.length);
            const any = parts.length > 0;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: label, per_page: 20,
            });
            const hit = open.data.find((i) => i.title === title);

            if (any) {
              const body = [
                `Weekly security scan on \`main\` found something to review — ${new Date().toISOString().slice(0, 10)}.`,
                ``,
                `Run: ${runUrl}`,
                ...parts,
                ``,
                `_Auto-managed by \`.github/workflows/security-scan.yml\`. Triage each item; close this issue once resolved or accepted._`,
              ].join("\n");
              if (hit) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: hit.number, body });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: [label] });
              }
              core.setFailed("Security scan found issues — see the tracking issue.");
            } else if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: hit.number,
                body: `✅ Clean scan on ${runUrl} — closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: hit.number,
                state: "closed", state_reason: "completed",
              });
            } else {
              core.info("Security scan clean, nothing open.");
            }
