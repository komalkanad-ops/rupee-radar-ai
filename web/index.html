<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://rupeeradarai.com/" />
    <meta name="robots" content="index, follow" />
    <!-- Default/fallback tags for the very first paint before React mounts — react-helmet-async
         (see src/main.tsx) overrides these per-route once the app hydrates. This is a pure client-
         rendered SPA with no SSR, so these static tags are also what a crawler sees if it doesn't
         execute JS. -->
    <title>Rupee Radar AI — Track spends, maximise credit card rewards</title>
    <meta
      name="description"
      content="Rupee Radar AI tracks your expenses from SMS, tells you which credit card to use where, and shows your true net worth. Free to browse online, full experience on Android."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rupee Radar AI" />
    <meta property="og:title" content="Rupee Radar AI — Track spends, maximise credit card rewards" />
    <meta
      property="og:description"
      content="Rupee Radar AI tracks your expenses from SMS, tells you which credit card to use where, and shows your true net worth."
    />
    <meta property="og:url" content="https://rupeeradarai.com/" />
    <meta property="og:image" content="https://rupeeradarai.com/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Rupee Radar AI — Track spends, maximise credit card rewards" />
    <meta
      name="twitter:description"
      content="Rupee Radar AI tracks your expenses from SMS, tells you which credit card to use where, and shows your true net worth."
    />
    <meta name="twitter:image" content="https://rupeeradarai.com/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
